version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: request_system_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/
      - ./docker/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=request_system
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
    command: >
      bash -c "docker-php-ext-install pdo_mysql mysqli &&
               a2enmod rewrite &&
               apache2-foreground"

  db:
    image: mysql:8.0
    container_name: request_system_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: request_system
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: request_system_phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: app_user
      PMA_PASSWORD: app_password
    depends_on:
      - db

volumes:
  db_data: